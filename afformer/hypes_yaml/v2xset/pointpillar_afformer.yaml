name: pointpillar_afformer
root_dir: 'dataset/v2xset/train'
validate_dir: 'dataset/v2xset/validate'
test_dir: 'dataset/v2xset/test'

num_sweep_frames: &k 3

channel_params:
  SNR_fix: False
  SNR: -10.0
  freq_GHz: 5.9                  # 5.9 GHz (ITS-G5 / NR-V2X)
  bandwidth_Hz: 10e6              # 10 MHz
  Pt_dBm: 23.0        # 200 mW
  Gt_cav_dBi: 3  
  Gt_rsu_dBi: 6                # Transmitter antenna gain
  Gr_dBi: 3                   # Receiver antenna gain
  NF_dB: 6                      # Noise figure

yaml_parser: "load_point_pillar_params"
train_params:
  batch_size: &batch_size 2
  epoches: 100
  patience: 10
  max_cav: &max_cav 5

input_source: ['lidar']
label_type: 'lidar'

comm_range: 70

fusion:
  core_method: 'intermediate' # late, early, intermediate supported
  dataset: 'v2xset'
  args: []

# preprocess-related
preprocess:
  # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor, SpVoxelPreprocessor
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: &voxel_size [0.4, 0.4, 4]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  # lidar range for each individual cav.
  cav_lidar_range: &cav_lidar [-140.8, -38.4, -3, 140.8, 38.4, 1]

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: [ 'x' ]

  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [ -0.78539816, 0.78539816 ]

  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [ 0.95, 1.05 ]

# anchor box related
postprocess:
  core_method: 'VoxelPostprocessor' # VoxelPostprocessor, BevPostprocessor supported
  gt_range: *cav_lidar
  anchor_args:
    gt_range: *cav_lidar
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: &anchor_yaw [0, 90]
    feature_stride: 4
    num: &achor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.27
  order: 'hwl' # hwl or lwh
  max_num: 100 # maximum number of objects in a single frame. use this number to make sure different frames has the same dimension in the same batch
  nms_thresh: 0.15
  dir_args: &dir_args
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *anchor_yaw

# model related
model:
  core_method: point_pillar_tomv_kd
  args: &model_args
    voxel_size: *voxel_size
    lidar_range: *cav_lidar
    anchor_number: *achor_num
    max_cav: *max_cav
    seq_len: *k
    
    backbone_fix: false
    fading: False
    encoder_type: basic 
      
    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters: [64]
    point_pillar_scatter:
      num_features: 64

    base_bev_backbone:
      layer_nums: [3, 5, 8]
      layer_strides: [2, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]
    shrink_header:
      kernal_size: [3]
      stride: [2]
      padding: [1]
      dim: [256]
      input_dim: 384 # 128 * 3
    
    dir_args: *dir_args


    transformer:
      dim_in: 256
      dim_out: 64
      # agent-wise attention
      cav_att_config: &cav_att_config
        # number of encoder layers
        depth: 1
        # dimension of the input feature
        dim: 256
        # epsilon for LayerNorm
        eps: 1e-05
        heads: 8
        dim_head: 32
        dropout: 0.3
      temporal_att_config:
        # number of encoder layers
        depth: 1
        # dimension of the input feature
        dim: 256
        # epsilon for LayerNorm
        eps: 1e-05
        heads: 8
        dim_head: 32
        dropout: 0.3
      height_att_config: 
        # number of encoder layers
        depth: 1
        # dimension of the input feature
        dim: 256
        # epsilon for LayerNorm
        eps: 1e-05
        heads: 8
        dim_head: 32
        dropout: 0.3
        bias: True
      width_att_config: 
        # number of encoder layers
        depth: 1
        # dimension of the input feature
        dim: 256
        # epsilon for LayerNorm
        eps: 1e-05
        heads: 8
        dim_head: 32
        dropout: 0.3
        bias: True
      # feedforward condition
      feed_forward: &feed_forward
        # dimension of the input feature
        mlp_dim: 256
        # dropout rate
        dropout: 0.3
        # bias
        bias: True
        # expansion factor
        ffn_expansion_factor: 2.66
      
kd_flag:
  teacher_model: point_pillar_tomv_teacher
  teacher_model_config: *model_args
  teacher_path: "afformer/logs/v2xset/poontpillar_early/2024_12_06_18_17_09/net_epoch85.pth"

loss:
  # core_method: point_pillar_tomv_loss
  core_method: point_pillar_loss
  args:
    pos_cls_weight: 2.0
    cls:
      type: 'SigmoidFocalLoss'
      alpha: 0.25
      gamma: 2.0
      weight: 1.0
    reg:
      type: 'WeightedSmoothL1Loss'
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: 'WeightedSoftmaxClassificationLoss'
      weight: 0.2
      args: *dir_args
    kd:
      weight: 10000 
      decoder_kd: true

optimizer:
  core_method: Adam
  lr: 0.001
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep #step, multistep, one_cycle, cosineannealwarm
  gamma: 0.1
  step_size: [15, 25, 50]